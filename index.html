<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ma gratte</title>
<meta name="description" content="Mon cours de guitare, mes morceaux, mon manche et mon bilan, au même endroit.">
<meta name="theme-color" content="#eceee9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ma gratte">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<script src="reglages.js"></script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-in">
      <div class="brand"><img src="icons/icon-192.png" alt="" width="28" height="28"><span>Ma gratte</span></div>
      <div class="top-tools">
        <button class="back-chip" id="backToCours" type="button" hidden>← Retour au cours</button>
        <button class="chip-timer seance-chip" id="seanceChip" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 13.5V9.5M9.5 2.5h5M12 2.5V6M18.4 6.6l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><b>0:00</b>
        </button>
        <button class="chip-timer mini-timer" id="miniTimer" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3h11M6.5 21h11M7.5 3c0 5 9 5 9 9s-9 4-9 9M16.5 3c0 5-9 5-9 9s9 4 9 9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><b></b>
        </button>
        <button class="icon-btn" id="metroBtn" type="button" aria-label="Métronome" title="Métronome">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 3h5.6l4 18H5.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 15.5 17 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7 16h10" stroke="currentColor" stroke-width="1.8"/></svg>
          <span class="metro-bpm" id="metroBadge" hidden></span>
        </button>
      </div>
    </div>
  </header>

  <main id="views">
    <section class="view" id="view-cours" data-view="cours">
      <nav class="cours-tabs" id="coursTabs" aria-label="Choisir un cours"></nav>
      <div class="wrap" id="coursBody"></div>
    </section>

    <section class="view" id="view-manche" data-view="manche" hidden>
      <iframe id="mancheFrame" title="Mon manche" allow="microphone; autoplay"></iframe>
    </section>

    <section class="view" id="view-morceaux" data-view="morceaux" hidden>
      <div class="wrap" id="morceauxBody"></div>
    </section>

    <section class="view" id="view-jeux" data-view="jeux" hidden>
      <div class="wrap" id="jeuxBody"></div>
    </section>

    <section class="view" id="view-bilan" data-view="bilan" hidden>
      <div class="wrap" id="bilanBody"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <button type="button" data-go="cours" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Mon cours</span>
    </button>
    <button type="button" data-go="manche">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 7.6h14" stroke="currentColor" stroke-width="2.4"/><path d="M5 12.2h14M5 16.4h14" stroke="currentColor" stroke-width="1.2"/><path d="M9.7 7.6v12.9M14.3 7.6v12.9" stroke="currentColor" stroke-width="1"/><circle cx="14.3" cy="10" r="1.7" fill="currentColor"/></svg>
      <span>Mon manche</span>
    </button>
    <button type="button" data-go="morceaux">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5.5l11-2V16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Mes morceaux</span>
    </button>
    <button type="button" data-go="jeux">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 8h9a4.5 4.5 0 0 1 4.4 5.4l-.8 4A2.6 2.6 0 0 1 15.6 18l-2-2.2h-3.2l-2 2.2a2.6 2.6 0 0 1-4.5-.6l-.8-4A4.5 4.5 0 0 1 7.5 8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 10.8v3M6.5 12.3h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="15.5" cy="11.3" r="1" fill="currentColor"/><circle cx="17" cy="13.3" r="1" fill="currentColor"/></svg>
      <span>Jeux</span>
    </button>
    <button type="button" data-go="bilan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Mon bilan</span>
    </button>
  </nav>
</div>

<!-- Métronome -->
<dialog class="sheet" id="metroSheet" aria-labelledby="metroTitle">
  <div class="sheet-in">
    <div class="sheet-head"><h2 id="metroTitle">Métronome</h2><button class="icon-btn" type="button" data-close aria-label="Fermer">✕</button></div>
    <div class="metro">
      <div class="metro-dots" id="metroDots"><i></i><i></i><i></i><i></i></div>
      <div class="metro-row">
        <button class="btn" type="button" data-bpm="-5">−5</button>
        <button class="btn" type="button" data-bpm="-1">−1</button>
        <output class="metro-out" id="metroOut">60</output>
        <button class="btn" type="button" data-bpm="1">+1</button>
        <button class="btn" type="button" data-bpm="5">+5</button>
      </div>
      <input type="range" id="metroRange" min="30" max="200" value="60" aria-label="Tempo en bpm">
      <div class="seg" role="group" aria-label="Temps par mesure" id="metroBeats">
        <button type="button" data-beats="2">2</button><button type="button" data-beats="3">3</button><button type="button" data-beats="4" aria-pressed="true">4</button><button type="button" data-beats="1">Sans accent</button>
      </div>
      <button class="btn primary big" id="metroToggle" type="button">Démarrer</button>
    </div>
  </div>
</dialog>

<!-- Récap envoyé au prof -->
<dialog class="sheet" id="recapSheet" aria-labelledby="recapTitle">
  <div class="sheet-in">
    <div class="sheet-head"><h2 id="recapTitle">Ton bilan de la semaine</h2><button class="icon-btn" type="button" data-close aria-label="Fermer">✕</button></div>
    <div id="recapVoix"></div>
    <p class="muted small">Envoie-le dans ton projet Guitare sur Claude : je fais la synthèse, je t'envoie un récap et j'adapte la semaine suivante.</p>
    <pre class="recap" id="recapText"></pre>
    <div class="sheet-actions">
      <button class="btn primary big" id="recapShare" type="button">Envoyer à mon prof</button>
      <button class="btn big" id="recapCopy" type="button">Copier le texte</button>
      <a class="btn big ghost" id="recapOpen" href="https://claude.ai/code/project/chan_01Dgiqrk7dDH3Kf79dSDsg79" target="_blank" rel="noopener">Ouvrir mon projet Claude</a>
    </div>
    <p class="muted small" id="recapStatus" role="status"></p>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="sons.js"></script>
<script src="jeux.js"></script>
<script src="niveaux.js"></script>
<script src="app.js"></script>
</body>
</html>
